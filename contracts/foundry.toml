[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

remappings = [
  "forge-std/=lib/forge-std/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/"
]

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"
arc_mainnet = "https://rpc.mainnet.arc.io"

[etherscan]
arc_testnet = { key = "none", url = "https://testnet.arcscan.app/api" }
